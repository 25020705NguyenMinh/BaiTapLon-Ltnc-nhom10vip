spring.application.name=auction-server
server.port=${PORT:8080}
spring.config.import=optional:file:./config/application-local.properties,optional:file:../config/application-local.properties

# Cấu hình kết nối TiDB Cloud (đưa db lên server của TiDB nhé)
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/auction_db?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${DB_USERNAME:cqWvjeJYA9Hz99z.root}
spring.datasource.password=${DB_PASSWORD:sP6RCC2DOMShEVrw}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate & JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000
app.otp.expiration-minutes=3
app.otp.resend-cooldown-seconds=60
app.otp.max-attempts=5
app.mail.from=${MAIL_USER:no-reply@techauction.local}
