spring.application.name=auction-server
server.port=${PORT:8080}
spring.config.import=optional:file:./config/application-local.properties,optional:file:../config/application-local.properties
# Full JDBC URL is accepted for managed MySQL. Host/port defaults also work locally.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auction}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USER:auction_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000
app.otp.expiration-minutes=3
app.otp.resend-cooldown-seconds=60
app.otp.max-attempts=5
app.mail.from=${MAIL_USER:no-reply@techauction.local}
