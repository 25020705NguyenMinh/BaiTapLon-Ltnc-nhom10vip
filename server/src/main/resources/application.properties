spring.application.name=auction-server
server.port=8080
# ===== Database MySQL =====
# createDatabaseIfNotExist=true: tự tạo database "auction" nếu chưa có.
# Đặt mật khẩu bằng biến môi trường DB_PASSWORD (đừng commit mật khẩu thật lên git).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auction}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=tn662466
# update: Hibernate tự tạo/bổ sung bảng. Khi nộp bài/deploy thật nên đổi thành validate hoặc none.
spring.jpa.hibernate.ddl-auto=update
# Server dùng đồng hồ UTC => lưu/đọc thời gian theo UTC cho khớp
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# JWT: secret tối thiểu 32 ký tự. Khi deploy thật hãy đặt biến môi trường JWT_SECRET
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000

# ===== OTP =====
app.otp.expiration-minutes=3
app.otp.resend-cooldown-seconds=60
app.otp.max-attempts=5

# ===== Gửi email =====
