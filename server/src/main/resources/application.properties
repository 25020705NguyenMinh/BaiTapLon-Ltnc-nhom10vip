spring.application.name=auction-server
server.port=8080
# Database H2 lưu ra file ./data/auction (tắt server vẫn còn tài khoản)
spring.datasource.url=jdbc:h2:file:./data/auction
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: secret tối thiểu 32 ký tự. Khi deploy thật hãy đặt biến môi trường JWT_SECRET
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000

# ===== OTP =====
app.otp.expiration-minutes=3
app.otp.resend-cooldown-seconds=60
app.otp.max-attempts=5

# ===== Gửi email =====
# Để TRỐNG phần spring.mail.* thì server KHÔNG gửi mail, chỉ in mã OTP ra console (tiện test).
# Muốn gửi mail thật: bỏ dấu # ở 7 dòng dưới (xem hướng dẫn Gmail ở cuối bài).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ta2mauction@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${spring.mail.username:no-reply@techauction.local}
# Cấu hình Google OAuth2 Client
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
